# Despliegue de Paideia con Pai conectada (Render, plan gratuito)
#
# La app es un servidor HTTP con estado (contador de llamadas, sesiones y
# catálogo en memoria), no una función sin estado. Render ejecuta el proceso
# tal cual, sin reescribir el backend ni exponer la clave en el navegador.
#
# Las claves NO se guardan aquí: se pegan en el panel de Render y quedan
# marcadas con `sync: false`.
#
# Proveedor del chat: `PAIDEIA_LLM_PROVIDER` vale `commandcode` (Beam 1.0
# gratuito del plan), `vercel` (misma familia por la puerta de Vercel) o `groq`.
# Hay que pegar la clave del proveedor en el panel de Render; la app solo puede
# enviar la clave al host del proveedor elegido. Para volver a Groq basta con
# poner `groq` aquí y sincronizar el blueprint.
services:
  - type: web
    name: paideia
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: python --version
    startCommand: python app/app.py
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PAIDEIA_GROQ_ENABLED
        value: "1"
      - key: PAIDEIA_LLM_PROVIDER
        value: commandcode
      - key: PAIDEIA_GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: PAIDEIA_CALLS_PER_DAY
        value: "300"
      - key: PAIDEIA_CALLS_PER_MINUTE
        value: "10"
      - key: GROQ_API_KEY
        sync: false
      - key: COMMANDCODE_API_KEY
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
