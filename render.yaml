# Despliegue de Paideia con Pai conectada (Render, plan gratuito)
#
# DECISIÓN DE PRODUCTO: esto se queda en el plan GRATUITO. No se sube a un plan de
# pago. Si el tráfico supera lo que aguanta una instancia, el producto sigue en
# gratis: se acepta la cola antes que la factura.
#
# Lo que el plan gratuito SÍ permite (medido el 25/11/2026 con 50 usuarios
# simultáneos reales contra este servicio): 50/50 peticiones respondidas, 0
# rechazadas, mediana 16,1 s, la más lenta 21,8 s. La concurrencia NO es el
# problema del plan gratuito.
#
# Lo único que impone es el APAGADO por inactividad: tras 15 minutos sin tráfico
# el servicio duerme, y el primero que entra espera 30-50 s de arranque en frío.
# ESO SE ACEPTA. Es una decisión de producto: no se paga un plan y no se mantiene
# un ping periódico para evitarlo. Quien lea esto, que no lo "arregle".
#
# La app es un servidor HTTP con estado (contador de llamadas, sesiones y
# catálogo en memoria), no una función sin estado. Render ejecuta el proceso
# tal cual, sin reescribir el backend ni exponer la clave en el navegador.
#
# Las claves NO se guardan aquí: se pegan en el panel de Render y quedan
# marcadas con `sync: false`.
#
# Proveedor del chat: `PAIDEIA_LLM_PROVIDER` vale `commandcode` (Beam 1.0
# gratuito del plan), `vercel` (misma familia por la puerta de Vercel) o `groq`.
# Hay que pegar la clave del proveedor en el panel de Render; la app solo puede
# enviar la clave al host del proveedor elegido. Para volver a Groq basta con
# poner `groq` aquí y sincronizar el blueprint.
services:
  - type: web
    name: paideia
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: python --version
    startCommand: python app/app.py
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PAIDEIA_GROQ_ENABLED
        value: "1"
      - key: PAIDEIA_LLM_PROVIDER
        value: commandcode
      - key: PAIDEIA_GROQ_MODEL
        value: openai/gpt-oss-120b
      # Cupos del chat. El techo real del plan gratuito es la RAM (512 MB) y el
      # proceso único, no estas cifras. Se ponen por encima de la sala esperada
      # (50 alumnos preguntando varias veces en el mismo minuto ≈ 150) para que
      # nadie reciba un rechazo por cupo mientras quede memoria.
      # NO bajarlos: medido, con 10/min y 4 turnos simultáneos el usuario 5 de una
      # sala de 50 recibía un rechazo inmediato.
      - key: PAIDEIA_CALLS_PER_MINUTE
        value: "400"
      - key: PAIDEIA_CALLS_PER_DAY
        value: "40000"
      - key: GROQ_API_KEY
        sync: false
      - key: COMMANDCODE_API_KEY
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
