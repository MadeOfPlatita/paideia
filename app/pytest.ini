[pytest]
# `tk_window` marca las pruebas que abren una ventana Tk real. Conftest las
# salta cuando el entorno no puede abrirla (runtime sin Tcl completo, servidor
# sin escritorio) para que la puerta de calidad no se ponga en rojo por el
# entorno en lugar de por el código.
markers =
    tk_window: necesita abrir una ventana Tk real
